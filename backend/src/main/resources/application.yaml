spring:
  config:
    import:
      - optional:file:.env[.properties]
  application:
    name: URL_SHORTENER
    version: "@project.version@"
  h2:
    console:
      enabled: true
  datasource:
    generate-unique-name: false
    name: ${DATASOURCE_NAME}
    url: ${URL_SHORTENER_DB_URL}
    username: ${URL_SHORTENER_DB_USERNAME}
    password: ${URL_SHORTENER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: Postgres_Database
  jpa:
    properties:
      .hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update #TODO: Change to flyway to ensure safe migration
    show-sql: true
  data:
    redis:
      host: "localhost"
      port: "6379"
      repositories:
        enabled: false
  cache:
    type: redis
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_SERVER_USERNAME}
    password: ${SMTP_SERVER_PASSWORD}
    properties: #check jakarta.mail documentation for more information of these properties
      mail:
        smtp:
          auth: true
          starttls:
            enable: true


logging:
  level:
    root: info
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

server:
  port: ${SERVER_PORT}
  address: ${SERVER_ADDRESS}