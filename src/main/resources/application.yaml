spring:
  application:
    name: UrlShortener
  h2:
    console:
      enabled: true
  datasource:
    generate-unique-name: false
    name: url_shortener
    url: ${URL_SHORTENER_DB_URL}
    username: ${URL_SHORTENER_DB_USERNAME}
    password: ${URL_SHORTENER_DB_PASSWORD} #TODO: change to env variable before committing
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      .hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update #TODO: Change to flyway to ensure safe migration
    show-sql: true

logging:
  level:
    root: info
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG