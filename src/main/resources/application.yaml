spring:
  config:
    import:
      - optional:file:.env[.properties]
  application:
    name: UrlShortener
  h2:
    console:
      enabled: true
  datasource:
    generate-unique-name: false
    name: url_shortener
    url: ${URL_SHORTENER_DB_URL}
    username: ${URL_SHORTENER_DB_USERNAME}
    password: ${URL_SHORTENER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      .hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update #TODO: Change to flyway to ensure safe migration
    show-sql: true
  data:
    redis:
      host: "localhost"
      port: "6379"
  cache:
    type: redis

logging:
  level:
    root: info
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG

server:
  port: 8080
  address: "localhost"